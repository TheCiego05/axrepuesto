name: Deploy Llave10

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Inyectar Supabase Key
        run: |
          # Reemplazar cualquier valor existente en SUPABASE_KEY
          sed -i "s|const SUPABASE_KEY  = '.*';|const SUPABASE_KEY  = '${{ secrets.SUPABASE_ANON_KEY }}';|g" js/supabase.js
          echo "✅ Supabase key inyectada"

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
